name: release

on:
  push:
    tags: ["v*"]

# contents: write  -> create the GitHub release
# id-token: write  -> mints the OIDC token npm Trusted Publishing authenticates
#                     with, and is also what `--provenance` needs for the
#                     "published from muraa-p/preimage@<sha>" stamp.
permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    # Publishing is irreversible, so only this repository publishes, and only a
    # tag whose version matches package.json gets through.
    if: github.repository == 'muraa-p/preimage'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          # registry-url writes an .npmrc pointing at npmjs. No authToken is set
          # on purpose: Trusted Publishing has no token to configure.
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm 11.5.1 or newer. Node 24 ships an older npm
      # 11.x, so upgrade unconditionally rather than parsing version strings in
      # shell. This job runs once per release; a few seconds is not worth a
      # comparison that is awkward to test and easy to get wrong.
      - name: Upgrade npm
        run: |
          npm install -g npm@latest
          echo "npm $(npm --version) on node $(node --version)"

      - name: Confirm the tag matches package.json
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          WANTED="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$WANTED" ]; then
            echo "refusing to publish: tag $GITHUB_REF_NAME does not match package.json version $WANTED"
            exit 1
          fi

      - name: Confirm the version is not already on npm
        run: |
          set -euo pipefail
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "refusing to publish: $NAME@$VERSION already exists on npm"
            exit 1
          fi

      - name: Test
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm test

      # No NODE_AUTH_TOKEN. If Trusted Publishing is not configured on the npm
      # side this fails with a 401, which is the correct and intended signal:
      # there is no long-lived secret to fall back to, and that is the point.
      - name: Publish
        run: npm publish --provenance --access public

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}