name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # preimage touches the filesystem in ways that differ per platform:
        # case sensitivity, symlink permissions, path separators and rename
        # semantics. Testing one platform would hide exactly the bugs most
        # likely to bite a user.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Syntax check
        run: npm run check

      - name: Test
        run: npm test

  smoke:
    name: published package works when installed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Pack the tarball npm would publish
        run: npm pack --pack-destination "$RUNNER_TEMP"

      # A scoped package produces muraa-p-preimage-0.1.0.tgz, so the tarball
      # name is derived rather than assumed. A glob that no longer matches
      # would otherwise fail much later, with a confusing error.
      - name: Locate the tarball
        id: tarball
        run: echo "path=$(ls "$RUNNER_TEMP"/*.tgz)" >> "$GITHUB_OUTPUT"

      - name: Install the tarball into a clean project
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y >/dev/null
          npm install "${{ steps.tarball.outputs.path }}" --no-audit --no-fund
          mkdir -p src
          printf 'const answer = 42;\n' > src/app.js

      # This is the check that matters: the `files` allowlist in package.json can
      # silently drop a module, and only running the real bin from a real install
      # catches it.
      - name: Checkpoint and restore through the installed binary
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/consumer"
          ./node_modules/.bin/preimage checkpoint "smoke test"
          printf 'const answer = 0;\n' > src/app.js
          ./node_modules/.bin/preimage diff
          ./node_modules/.bin/preimage restore 1 --yes
          grep -q 'const answer = 42;' src/app.js
          echo "restore through the published package works"

      - name: Check the MCP server starts
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/consumer"
          printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | ./node_modules/.bin/preimage mcp | grep -q preimage_restore
          echo "mcp server starts from the published package"